<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">量化面试题解手册学习路径</title>
  <desc id="desc">从数据结构、脑筋急转弯、概率、博弈、统计、编程到金融直觉的七个板块学习地图。</desc>
  <rect width="1200" height="420" fill="#fffefb"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c15f3c"/>
    </marker>
  </defs>
  <style>
    .lane-label { font: 600 22px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1f2b25; }
    .lane-sub { font: 400 15px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #6b776f; }
    .chip { font: 500 17px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #4b5b50; }
  </style>
  <text x="60" y="70" class="lane-label">量化面试的四大能力面</text>
  <text x="60" y="98" class="lane-sub">概念会讲 · 题会推 · 代码会写 · 金融有直觉</text>
  <rect x="60" y="130" width="255" height="90" rx="10" fill="#eff8f4" stroke="#d7e6df"/>
  <text x="85" y="168" class="chip">数据结构与算法</text>
  <text x="85" y="196" class="lane-sub">复习提纲 · C++ 手写例题</text>
  <rect x="355" y="130" width="255" height="90" rx="10" fill="#f7ece4" stroke="#e8d5c8"/>
  <text x="380" y="168" class="chip" fill="#974326">脑筋急转弯 · 博弈</text>
  <text x="380" y="196" class="lane-sub">结构化拆题 · 完整解答</text>
  <rect x="650" y="130" width="255" height="90" rx="10" fill="#eef4fa" stroke="#d6e0ea"/>
  <text x="675" y="168" class="chip">概率 · 统计</text>
  <text x="675" y="196" class="lane-sub">期望递推 · 贝叶斯 · 回归</text>
  <rect x="945" y="130" width="215" height="90" rx="10" fill="#f1f6ec" stroke="#dde8d4"/>
  <text x="970" y="168" class="chip">编程 · 金融直觉</text>
  <text x="970" y="196" class="lane-sub">题型套路 · 夏普与期权</text>
  <path d="M 315 175 L 345 175" stroke="#c15f3c" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 610 175 L 640 175" stroke="#c15f3c" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 905 175 L 935 175" stroke="#c15f3c" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="260" width="1100" height="110" rx="10" fill="#fff7ed" stroke="#f0dccd"/>
  <text x="90" y="300" class="lane-label" font-size="19">使用建议：先过概念章节建立框架，再按题型做例题；每章末的检查清单用于面试前快速自测。</text>
  <text x="90" y="332" class="lane-sub">来源题库覆盖约 265 道真题：10 道脑题 · 88 道概率 · 11 道博弈 · 46 道统计 · 75 道编程 · 35 道金融直觉</text>
</svg>
