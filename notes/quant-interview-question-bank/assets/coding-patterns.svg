<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">编程题题型地图</title>
  <desc id="desc">动态规划、滑动窗口、字符串栈、二分数学与数据结构设计五类题型地图。</desc>
  <rect width="1200" height="420" fill="#fffefb"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c15f3c"/>
    </marker>
  </defs>
  <style>
    .g { font: 600 20px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1f2b25; }
    .s { font: 400 15px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #6b776f; }
    .c { font: 500 17px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #4b5b50; }
  </style>
  <text x="60" y="66" class="g">75 道编程题收敛到五个模板</text>
  <rect x="60" y="100" width="200" height="120" rx="10" fill="#f1f6ec" stroke="#dde8d4"/>
  <text x="85" y="136" class="c">动态规划</text>
  <text x="85" y="164" class="s">最大子数组 · LIS</text>
  <text x="85" y="190" class="s">花束 · 跳跃 · 拆分</text>
  <rect x="300" y="100" width="200" height="120" rx="10" fill="#f1f6ec" stroke="#dde8d4"/>
  <text x="325" y="136" class="c">滑动窗口</text>
  <text x="325" y="164" class="s">和为 K · 唯一值</text>
  <text x="325" y="190" class="s">前缀和 · 频率</text>
  <rect x="540" y="100" width="200" height="120" rx="10" fill="#f1f6ec" stroke="#dde8d4"/>
  <text x="565" y="136" class="c">字符串与栈</text>
  <text x="565" y="164" class="s">括号 · 退格比较</text>
  <text x="565" y="190" class="s">模式计数</text>
  <rect x="780" y="100" width="200" height="120" rx="10" fill="#f1f6ec" stroke="#dde8d4"/>
  <text x="805" y="136" class="c">二分与数学</text>
  <text x="805" y="164" class="s">sqrt(n,p) · 蒙特卡洛</text>
  <text x="805" y="190" class="s">溢出与精度</text>
  <rect x="1020" y="100" width="140" height="120" rx="10" fill="#f1f6ec" stroke="#dde8d4"/>
  <text x="1045" y="136" class="c">结构设计</text>
  <text x="1045" y="164" class="s">运行中位数</text>
  <text x="1045" y="190" class="s">随机采样</text>
  <rect x="60" y="260" width="1100" height="110" rx="10" fill="#fff7ed" stroke="#f0dccd"/>
  <text x="90" y="300" class="g" font-size="18">先用 15 分钟把暴力解讲清楚，再优化：状态定义 → 转移 → 边界 → 复杂度。</text>
  <text x="90" y="332" class="s">示例用 C++：注意整型溢出、空输入、单一元素和负数四类边界。</text>
</svg>
