<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">数据结构与算法知识地图</title>
  <desc id="desc">从线性结构、树结构、图到排序、查找与组合枚举的知识地图。</desc>
  <rect width="1200" height="420" fill="#fffefb"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c15f3c"/>
    </marker>
  </defs>
  <style>
    .g { font: 600 20px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1f2b25; }
    .s { font: 400 15px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #6b776f; }
    .c { font: 500 16px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #4b5b50; }
  </style>
  <text x="60" y="66" class="g">数据结构与算法：面试复习的骨架</text>
  <rect x="60" y="100" width="255" height="120" rx="10" fill="#eff8f4" stroke="#d7e6df"/>
  <text x="85" y="136" class="c">线性结构</text>
  <text x="85" y="164" class="s">动态数组 · 链表</text>
  <text x="85" y="190" class="s">栈与队列</text>
  <rect x="355" y="100" width="255" height="120" rx="10" fill="#eff8f4" stroke="#d7e6df"/>
  <text x="380" y="136" class="c">树与哈希</text>
  <text x="380" y="164" class="s">哈希表 · 二叉搜索树</text>
  <text x="380" y="190" class="s">堆 · 优先队列 · Trie</text>
  <rect x="650" y="100" width="255" height="120" rx="10" fill="#eef4fa" stroke="#d6e0ea"/>
  <text x="675" y="136" class="c">图</text>
  <text x="675" y="164" class="s">BFS · DFS · 拓扑排序</text>
  <text x="675" y="190" class="s">环检测 · 连通性 · Dijkstra</text>
  <rect x="945" y="100" width="215" height="120" rx="10" fill="#f1f6ec" stroke="#dde8d4"/>
  <text x="970" y="136" class="c">算法范式</text>
  <text x="970" y="164" class="s">排序 · 二分 · 选择</text>
  <text x="970" y="190" class="s">枚举 · 位运算</text>
  <path d="M 315 160 L 345 160" stroke="#c15f3c" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 610 160 L 640 160" stroke="#c15f3c" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 905 160 L 935 160" stroke="#c15f3c" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="260" width="1100" height="110" rx="10" fill="#fff7ed" stroke="#f0dccd"/>
  <text x="90" y="300" class="g" font-size="18">面试口径：每个结构都要能说出「接口 · 复杂度 · 适用场景 · 反例」。</text>
  <text x="90" y="332" class="s">例如快排平均 O(n log n) 但有序输入退化 O(n²)；哈希表平均 O(1) 但最坏 O(n) 且无序。</text>
</svg>
