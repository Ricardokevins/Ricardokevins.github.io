<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">脑筋急转弯与博弈拆题框架</title>
  <desc id="desc">从读题、建模、求解到检验的四步拆题框架。</desc>
  <rect width="1200" height="420" fill="#fffefb"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c15f3c"/>
    </marker>
  </defs>
  <style>
    .g { font: 600 20px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1f2b25; }
    .s { font: 400 15px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #6b776f; }
    .c { font: 500 17px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #974326; }
  </style>
  <text x="60" y="66" class="g">脑题不是考知识，是考拆题的纪律</text>
  <rect x="60" y="105" width="240" height="105" rx="10" fill="#f7ece4" stroke="#e8d5c8"/>
  <text x="85" y="142" class="c">1 · 读题</text>
  <text x="85" y="170" class="s">找出约束与隐藏信息</text>
  <rect x="360" y="105" width="240" height="105" rx="10" fill="#f7ece4" stroke="#e8d5c8"/>
  <text x="385" y="142" class="c">2 · 建模</text>
  <text x="385" y="170" class="s">翻译成概率/组合/博弈</text>
  <rect x="660" y="105" width="240" height="105" rx="10" fill="#f7ece4" stroke="#e8d5c8"/>
  <text x="685" y="142" class="c">3 · 求解</text>
  <text x="685" y="170" class="s">小情形试出结构再推广</text>
  <rect x="960" y="105" width="200" height="105" rx="10" fill="#f7ece4" stroke="#e8d5c8"/>
  <text x="985" y="142" class="c">4 · 检验</text>
  <text x="985" y="170" class="s">极端情形 · 边界值</text>
  <path d="M 300 157 L 350 157" stroke="#c15f3c" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 600 157 L 650 157" stroke="#c15f3c" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 900 157 L 950 157" stroke="#c15f3c" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="255" width="1100" height="115" rx="10" fill="#fff7ed" stroke="#f0dccd"/>
  <text x="90" y="295" class="g" font-size="18">代表题型：贴错标签的罐子 · 过桥 · 毒酒 · 帽子 · 信封 · 最小唯一数 · 抓兔子</text>
  <text x="90" y="327" class="s">共同点：答案通常短，但要能讲清「为什么这个建模是对的」以及「换个问法哪里会变」。</text>
</svg>
