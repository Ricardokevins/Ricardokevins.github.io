<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">统计与数学知识地图</title>
  <desc id="desc">回归、估计、多元高斯与费米估算的知识地图。</desc>
  <rect width="1200" height="420" fill="#fffefb"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c15f3c"/>
    </marker>
  </defs>
  <style>
    .g { font: 600 20px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1f2b25; }
    .s { font: 400 15px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #6b776f; }
    .c { font: 500 17px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #4b5b50; }
  </style>
  <text x="60" y="66" class="g">统计：从一条回归线到一整套推断</text>
  <rect x="60" y="100" width="255" height="120" rx="10" fill="#eef4fa" stroke="#d6e0ea"/>
  <text x="85" y="136" class="c">回归</text>
  <text x="85" y="164" class="s">OLS 闭式解 · 双向系数</text>
  <text x="85" y="190" class="s">岭回归 · Lasso</text>
  <rect x="355" y="100" width="255" height="120" rx="10" fill="#eef4fa" stroke="#d6e0ea"/>
  <text x="380" y="136" class="c">估计</text>
  <text x="380" y="164" class="s">MLE · 贝叶斯更新</text>
  <text x="380" y="190" class="s">重复数据 · 随机回归元</text>
  <rect x="650" y="100" width="255" height="120" rx="10" fill="#eff8f4" stroke="#d7e6df"/>
  <text x="675" y="136" class="c">多元高斯</text>
  <text x="675" y="164" class="s">条件分布 · 相关界</text>
  <text x="675" y="190" class="s">组合方差 · 等效策略数</text>
  <rect x="945" y="100" width="215" height="120" rx="10" fill="#f1f6ec" stroke="#dde8d4"/>
  <text x="970" y="136" class="c">估算与杂题</text>
  <text x="970" y="164" class="s">费米估算 · 数论小题</text>
  <text x="970" y="190" class="s">误差传播</text>
  <path d="M 315 160 L 345 160" stroke="#c15f3c" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 610 160 L 640 160" stroke="#c15f3c" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 905 160 L 935 160" stroke="#c15f3c" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="260" width="1100" height="110" rx="10" fill="#fff7ed" stroke="#f0dccd"/>
  <text x="90" y="300" class="g" font-size="18">面试口径：每个公式都要能说出「假设是什么 · 违反时发生什么 · 怎么诊断」。</text>
  <text x="90" y="332" class="s">例如 OLS 高斯噪声下 MLE 与最小二乘重合；样本翻倍不改变点估计，但 t 统计量会变。</text>
</svg>
