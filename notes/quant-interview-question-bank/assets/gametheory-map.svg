<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">博弈论题解路径</title>
  <desc id="desc">从最优停止、轮盘估值到破产概率与下注尺度的题解路径。</desc>
  <rect width="1200" height="420" fill="#fffefb"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c15f3c"/>
    </marker>
  </defs>
  <style>
    .g { font: 600 20px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1f2b25; }
    .s { font: 400 15px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #6b776f; }
    .c { font: 500 17px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #974326; }
  </style>
  <text x="60" y="66" class="g">博弈题：从单步最优到长期生存</text>
  <rect x="60" y="100" width="345" height="120" rx="10" fill="#f7ece4" stroke="#e8d5c8"/>
  <text x="85" y="136" class="c">单局估值</text>
  <text x="85" y="164" class="s">骰子重掷 · 停止阈值</text>
  <text x="85" y="190" class="s">逆向归纳算期望</text>
  <rect x="445" y="100" width="345" height="120" rx="10" fill="#f7ece4" stroke="#e8d5c8"/>
  <text x="470" y="136" class="c">对手与先手</text>
  <text x="470" y="164" class="s">最小唯一数 · FBF/BFB</text>
  <text x="470" y="190" class="s">信息与顺序决定策略</text>
  <rect x="830" y="100" width="330" height="120" rx="10" fill="#f7ece4" stroke="#e8d5c8"/>
  <text x="855" y="136" class="c">长期资金</text>
  <text x="855" y="164" class="s">破产概率 · 三倍或归零</text>
  <text x="855" y="190" class="s">下注尺度与风险偏好</text>
  <path d="M 405 160 L 435 160" stroke="#c15f3c" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 790 160 L 820 160" stroke="#c15f3c" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="260" width="1100" height="110" rx="10" fill="#fff7ed" stroke="#f0dccd"/>
  <text x="90" y="300" class="g" font-size="18">核心判断：期望值为正只是入场券，能活到兑现期望的资金路径才是策略。</text>
  <text x="90" y="332" class="s">面试常追问：风险厌恶时怎么变？允许卖空时怎么变？连续下注时怎么变？</text>
</svg>
