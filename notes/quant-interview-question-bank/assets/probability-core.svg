<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">概率题工具箱</title>
  <desc id="desc">期望递推、序列等待、贝叶斯更新、对称性四大工具的地图。</desc>
  <rect width="1200" height="420" fill="#fffefb"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c15f3c"/>
    </marker>
  </defs>
  <style>
    .g { font: 600 20px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1f2b25; }
    .s { font: 400 15px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #6b776f; }
    .c { font: 500 17px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #4b5b50; }
  </style>
  <text x="60" y="66" class="g">概率题的四大工具</text>
  <rect x="60" y="100" width="255" height="120" rx="10" fill="#eef4fa" stroke="#d6e0ea"/>
  <text x="85" y="136" class="c">期望递推</text>
  <text x="85" y="164" class="s">E = 1 + pE 的状态机法</text>
  <text x="85" y="190" class="s">首达时间 · 几何分布</text>
  <rect x="355" y="100" width="255" height="120" rx="10" fill="#eef4fa" stroke="#d6e0ea"/>
  <text x="380" y="136" class="c">序列等待</text>
  <text x="380" y="164" class="s">HH 与 HT 的差别</text>
  <text x="380" y="190" class="s">自重叠 · n 连正公式</text>
  <rect x="650" y="100" width="255" height="120" rx="10" fill="#eff8f4" stroke="#d7e6df"/>
  <text x="675" y="136" class="c">贝叶斯更新</text>
  <text x="675" y="164" class="s">先验 · 似然 · 后验</text>
  <text x="675" y="190" class="s">判别偏币全变式</text>
  <rect x="945" y="100" width="215" height="120" rx="10" fill="#f1f6ec" stroke="#dde8d4"/>
  <text x="970" y="136" class="c">对称性</text>
  <text x="970" y="164" class="s">半圆 · 断棍 · 正态</text>
  <text x="970" y="190" class="s">指示变量求期望</text>
  <rect x="60" y="260" width="1100" height="110" rx="10" fill="#fff7ed" stroke="#f0dccd"/>
  <text x="90" y="300" class="g" font-size="18">先认题型，再选工具：89% 的概率面试题落在四个工具与它们的组合里。</text>
  <text x="90" y="332" class="s">算完必查三件事：结果在 [0,1] 内？退化情形对不对？期望量级合不合理？</text>
</svg>
