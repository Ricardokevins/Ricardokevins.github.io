<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">金融直觉知识地图</title>
  <desc id="desc">夏普比率、期权、市场微观结构与组合回测四个板块的知识地图。</desc>
  <rect width="1200" height="420" fill="#fffefb"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c15f3c"/>
    </marker>
  </defs>
  <style>
    .g { font: 600 20px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1f2b25; }
    .s { font: 400 15px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #6b776f; }
    .c { font: 500 17px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #974326; }
  </style>
  <text x="60" y="66" class="g">金融直觉：把数学接到市场</text>
  <rect x="60" y="100" width="255" height="120" rx="10" fill="#f7ece4" stroke="#e8d5c8"/>
  <text x="85" y="136" class="c">风险收益度量</text>
  <text x="85" y="164" class="s">夏普比率 · 年化换算</text>
  <text x="85" y="190" class="s">亏钱概率 · 0 收益日</text>
  <rect x="355" y="100" width="255" height="120" rx="10" fill="#f7ece4" stroke="#e8d5c8"/>
  <text x="380" y="136" class="c">期权</text>
  <text x="380" y="164" class="s">定价参数 · 欧式 vs 美式</text>
  <text x="380" y="190" class="s">跨式 · vega · 隐含波动率</text>
  <rect x="650" y="100" width="255" height="120" rx="10" fill="#f7ece4" stroke="#e8d5c8"/>
  <text x="675" y="136" class="c">微观结构</text>
  <text x="675" y="164" class="s">买卖价差 · 集合竞价</text>
  <text x="675" y="190" class="s">指数价格 · 篮子检测</text>
  <rect x="945" y="100" width="215" height="120" rx="10" fill="#f7ece4" stroke="#e8d5c8"/>
  <text x="970" y="136" class="c">组合与回测</text>
  <text x="970" y="164" class="s">beta 中性 · 最小方差</text>
  <text x="970" y="190" class="s">回测与实盘差异</text>
  <rect x="60" y="260" width="1100" height="110" rx="10" fill="#fff7ed" stroke="#f0dccd"/>
  <text x="90" y="300" class="g" font-size="18">回答框架：定义 → 计算/推导 → 假设与局限 → 市场上什么时候失效。</text>
  <text x="90" y="332" class="s">面试官想听的不是一个定义，而是你能不能指出「这个指标在哪里会被操纵或误读」。</text>
</svg>
